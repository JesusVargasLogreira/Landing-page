    data-portal-id="52188170"></div>
  <script>
    const initializeHubSpotForm = () => {
      const formFrame = document.querySelector('.hs-form-frame');
      const loadHubSpotForm = () => {
        if (formFrame.dataset.loading) return;
        formFrame.dataset.loading = 'true';
        const script = document.createElement('script');
        script.src = 'https://js.hsforms.net/forms/embed/52188170.js';
        script.async = true;
        script.onerror = () => {
          delete formFrame.dataset.loading;
          console.error('Unable to load the HubSpot form script.');
        };
        document.head.appendChild(script);
      };

      if ('IntersectionObserver' in window) {
        const formObserver = new IntersectionObserver((entries) => {
          if (entries.some((entry) => entry.isIntersecting)) {
            formObserver.disconnect();
            loadHubSpotForm();
          }
        }, { rootMargin: '400px' });
        formObserver.observe(formFrame);
      } else {
        loadHubSpotForm();
      }
    };

    if (document.readyState === 'complete') {
      initializeHubSpotForm();
    } else {
      window.addEventListener('load', initializeHubSpotForm, { once: true });
    }
  </script>
